# Scene collision objects for the safety hard-clamp (see urdf_arm_configuration.py's
# add_environment_object / virtual_spring_node.py's ~/load_collision_scene service).
#
# This is a plain data file, not a ROS parameters file -- it's read directly by
# ~/load_collision_scene, not through declare_parameter. Dimension ordering
# deliberately mirrors shape_msgs/SolidPrimitive so the mapping is a direct
# pass-through:
#   box:      dimensions: [x, y, z]       full side lengths (m)
#   cylinder: dimensions: [height, radius]  (m)
#
# Poses are world-frame (frame_id is currently informational only -- see the
# "No TF lookup" note in the safety-clamp plan). orientation is [x, y, z, w].
#
# Load with:
#   ros2 service call /virtual_spring_node/load_collision_scene \
#     springcontroller_interfaces/srv/LoadCollisionScene \
#     "{yaml_path: '/home/katallen/sandbox/src/springcontroller/springcontroller/config/gen3_collision_scene.yaml'}"

objects:

  table:
    shape: box
    dimensions: [1.524, 0.762, 0.05]
    frame_id: "world"
    pose:
      # z = -half the box height so the *top* face lands at z=0, flush with
      # base_link's origin -- matches the convention verified live in
      # gen3_live_table_scene.yaml. Centering at z=0.0 (the old value) put
      # the top face 2.5cm above the real table surface, so the box floated
      # above the true table in meshcat and the collision clamp could trip
      # on links that were actually still clear of the real table.
      # x/y measured live 2026-08-20: table is 60in (x) x 30in (y), with the
      # robot base 4.5in from the -x edge and 15.75in from the -y edge.
      # center = edge + half-dimension, in meters (1in = 0.0254m).
      position: [0.6477, -0.01905, -0.025]
      orientation: [0.0, 0.0, 0.0, 1.0]
    # Optional, YAML-only (moveit_msgs/CollisionObject has no field for this):
    # URDF link names to exclude from collision pairs against this object,
    # the environment-object equivalent of an SRDF <disable_collisions>
    # entry. Needed here because base_link legitimately sits right at the
    # table surface -- without this it registers a permanent few-cm
    # near-miss against the table and blanket-scales torques for no real
    # reason. See add_environment_object()'s docstring.
    exclude_links: ["base_link"]

  # Example of a live-tracked obstacle's *initial* placement -- a perception
  # node can keep this moving afterward with MOVE messages on
  # ~/collision_object using the same id ("person_1"), no scene reload needed.
  person_1:
    shape: cylinder
    dimensions: [1.0, 0.15]
    frame_id: "world"
    pose:
      # x/y centered on the pre-set participant seat position (see
      # workspace_seat_x/workspace_seat_y in
      # springcontroller_ui/config/study_control_panel.yaml) -- measured
      # live 2026-08-20: chair is 45cm in from the table's -x edge and
      # 30cm from the table's -y edge (same table edges as above).
      position: [0.3357, -0.10005, 0.0]
      orientation: [0.0, 0.0, 0.0, 1.0]
