/**:
  ros__parameters:

    # List of spring names to load. Each name must have a matching
    # entry in the 'springs' namespace below.
    spring_names:
      - tip_spring
      - elbow_spring

    springs:

      tip_spring:
        link_name:    "j2s7s300_joint_end_effector"          # must match a frame name in the URDF
        local_point:  [0.0, 0.0, 0.1] # attachment point in link-local frame (m)
        target:       [0.5, 0.0, 0.8] # target position in world frame (m)
        stiffness:    120.0            # N/m
        damping:      8.0              # N·s/m
        rest_length:  0.0              # m  (0 = zero-length spring)

      elbow_spring:
        link_name:    "j2s7s300_joint_4"
        local_point:  [0.0, 0.0, 0.2]
        target:       [0.2, 0.0, 0.5]
        stiffness:    60.0
        damping:      4.0
        rest_length:  0.0
