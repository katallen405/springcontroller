/**:
  ros__parameters:

    # List of spring names to load. Each name must have a matching
    # entry in the 'springs' namespace below.
    spring_names:
      - tip_spring


    springs:

      tip_spring:
        link_name:    "ur3e_tool0" # must match a frame name in the URDF
        local_point:  [0.0, 0.0, 0.0] # attachment point in link-local frame (m)
        target:       [0.018, -0.67, 0.12] # target position in world frame (m)
        stiffness:    100            # N/m
        damping:      0.0              # N·s/m
        rest_length:  0.0              # m  (0 = zero-length spring)

