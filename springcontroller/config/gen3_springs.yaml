/**:
  ros__parameters:

    # List of spring names to load.
    spring_names:
      - tip_spring

    springs:

      tip_spring:
        link_name:    "end_effector_link"        # between gripper fingers
        local_point:  [0.0, 0.0, 0.1]       # attachment point in link-local frame (m)
        target:       [0.4485, -0.1957, 0.1946] #position start study location
        # remove target above to put a spring wherever the arm is on startup
        stiffness:    50.0                   # N/m  (start low for safety)
        damping:      5.0                    # N·s/m
        rest_length:  0.0                    # m  (0 = zero-length spring)
        inner_radius: 0.0
        outer_radius: 0.0

      # Uncomment to add a second spring at the forearm
      # elbow_spring:
      #   link_name:    "forearm_link"
      #   local_point:  [0.0, 0.0, 0.1]
      #   target:       [0.3, 0.0, 0.4]
      #   stiffness:    30.0
      #   damping:      3.0
      #   rest_length:  0.0
      #   inner_radius: 0.0
      #   outer_radius: 0.0

    # Uncomment to keep the gripper's held block facing a fixed world
    # point (e.g. a study participant's face) while staying within a
    # bounded radius of a position goal -- EXPERIMENTAL hybrid
    # position-and-orientation spring, see PoseSpring in virtual_spring.py.
    # Unlike springs/joint_springs above, `target` has no safe default and
    # must be measured/set explicitly -- neither do position_center /
    # position_radius, which have no old-behavior-preserving default
    # either.
    # pose_spring_names:
    #   - face_participant
    #
    # pose_springs:
    #   face_participant:
    #     link_name:          "end_effector_link"
    #     local_point:        [0.0, 0.0, 0.1]   # gripper/block center, link-local (m)
    #     local_face_normal:  [0.0, 0.0, 1.0]   # the block's working face, link-local
    #     target:             [0.6, 0.4, 0.5]   # participant's measured face position (m)
    #     stiffness:          2.0                # N*m/rad (start low for safety)
    #     damping:            0.2                # N*m*s/rad
    #     position_center:    [0.3, 0.0, 0.4]   # e.g. same target as tip_spring above (m)
    #     position_radius:    0.12                # m
