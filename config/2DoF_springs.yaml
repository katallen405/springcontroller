/**:
  ros__parameters:

    # List of spring names to load. Each name must have a matching
    # entry in the 'springs' namespace below.
    spring_names:
      - tip_spring
      - elbow_spring

    springs:

      tip_spring:
        link_name:    "joint_end_effector"          # must match a frame name in the URDF
        local_point:  [0.0, 0.0, 0.00] # attachment point in link frame (m)
        target:       [1.5, 0.0, 0.5] # target position in world frame (m)
        stiffness:    100.0            # N/m
        damping:      0.0              # N·s/m
        rest_length:  0.0              # m  (0 = zero-length spring)

      elbow_spring:
        link_name: "joint_2"
        local_point: [0.1, 0.0, 0.0]
        target: [0.0, 0.0, 0.0]
        stiffness: 50.0
        damping: 0.0
        rest_length: 0.0