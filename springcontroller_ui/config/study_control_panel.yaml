study_control_panel_node:
  ros__parameters:
    torque_enable_service: /gen3_torque_control/enable
    torque_status_topic: /gen3_torque_control/status
    # Position moves go through gen3_torque_control's own high-level move
    # primitive, not ros2_kortex/kortex_bringup -- see orchestration_node.py's
    # module docstring for why (the two drivers can't coexist against real
    # hardware).
    move_to_joint_angles_topic: /gen3_torque_control/move_to_joint_angles
    move_status_topic: /gen3_torque_control/move_status
    abort_move_service: /gen3_torque_control/abort_move
    check_collision_service: /virtual_spring_node/check_collision_at
    move_confirm_timeout_sec: 3.0
    add_spring_service: /virtual_spring_node/add_spring
    remove_spring_service: /virtual_spring_node/remove_spring
    spring_node_get_parameters_service: /virtual_spring_node/get_parameters
    safety_status_topic: /virtual_spring_node/safety_status
    # Matches the remap gen3_spring.launch.py already applies to
    # virtual_spring_node's /joint_states subscription -- gen3_torque_node
    # must be launched with the same remap (see the terminal-reminder text
    # in web/index.html) for this to actually receive data.
    joint_states_topic: /kinova/joint_states_lowlevel
    joint_names:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      - joint_7
    urdf_path: /home/katallen/sandbox/src/springcontroller/springcontroller/flat_urdf_files/gen3_kinova_flat.urdf
    locked_joint_names:
      - robotiq_85_left_knuckle_joint
      - robotiq_85_right_knuckle_joint
      - robotiq_85_left_inner_knuckle_joint
      - robotiq_85_right_inner_knuckle_joint
      - robotiq_85_left_finger_tip_joint
      - robotiq_85_right_finger_tip_joint
    tip_link_name: end_effector_link
    reset_spring_name: reset_tip_spring
    reset_spring_stiffness: 50.0
    reset_spring_damping: 5.0
    reset_spring_local_point: [0.0, 0.0, 0.1]
    study_start_preset_path: "~/springcontroller_ui_study_start.yaml"
    # Participant midline's pre-set seat position, world-frame meters (see
    # orchestration_node.py's declare_parameter comment). Measured live
    # 2026-08-20: 45cm in from the table's -x edge, and a further 30cm out
    # past the table's -y edge -- the participant sits off the end of the
    # table, not under it (see gen3_collision_scene.yaml's table pose).
    # Rounded to the nearest cm since nothing finer matters here.
    workspace_seat_x: 0.34
    workspace_seat_y: -0.70
    workspace_study_data_dir: "~/gen3_study_data"
    workspace_spring_name: tip_spring
    workspace_spring_stiffness: 50.0
    workspace_spring_damping: 5.0
    workspace_pose_spring_name: face_participant
    # The 'block' link preset's held face points along its local +y, not
    # +z -- see LINK_PRESETS in web/index.html (block: end_effector_link,
    # local_point [0,0,0.15]). Confirmed live 2026-09-03.
    workspace_pose_local_face_normal: [0.0, 1.0, 0.0]
    workspace_pose_stiffness: 2.0
    workspace_pose_damping: 0.2
    workspace_pose_position_stiffness: 10.0
    joint_state_freshness_sec: 1.0
    safety_status_freshness_sec: 3.0
    service_call_timeout_sec: 5.0
